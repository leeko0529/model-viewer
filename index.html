<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GRINMAX 3D Viewer</title>

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    :root{
      --accent:#0078ff;

      /* Neumorphism base */
      --bg:#e6e9ef;
      --card:#e6e9ef;
      --txt:#1b2430;
      --sub:#5d6b7a;

      --shadow1: 14px 14px 28px rgba(154, 165, 182, .55);
      --shadow2:-14px -14px 28px rgba(255, 255, 255, .85);

      --shadowIn1: inset 10px 10px 18px rgba(154, 165, 182, .45);
      --shadowIn2: inset -10px -10px 18px rgba(255, 255, 255, .85);

      --radius:18px;
      --radiusSm:14px;
    }

    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans KR",sans-serif;}

    .wrap{max-width:1100px;margin:0 auto;padding:18px;}
    header{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:12px;}

    .title{font-size:16px;font-weight:800;letter-spacing:.2px}
    .desc{font-size:12px;color:var(--sub);margin-top:4px}

    .btns{display:flex;gap:10px;flex-wrap:wrap}
    button{
      border:0;
      background:var(--card);
      color:var(--txt);
      padding:10px 12px;
      border-radius:999px;
      cursor:pointer;
      font-size:12px;
      box-shadow: var(--shadow1), var(--shadow2);
      transition: transform .08s ease, box-shadow .12s ease, color .12s ease;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    button:hover{transform: translateY(-1px)}
    button:active{
      transform: translateY(0);
      box-shadow: var(--shadowIn1), var(--shadowIn2);
    }
    button.primary{
      color:var(--accent);
      font-weight:800;
    }

    .card{
      position:relative;
      background:var(--card);
      border-radius:var(--radius);
      box-shadow: var(--shadow1), var(--shadow2);
      overflow:hidden;
    }

    .badge{
      position:absolute;left:14px;top:14px;
      padding:7px 11px;
      border-radius:999px;
      font-size:12px;
      font-weight:800;
      color:var(--accent);
      background:var(--card);
      box-shadow: var(--shadow1), var(--shadow2);
      letter-spacing:.3px;
    }

    model-viewer{
      width:100%;
      height:min(72vh,720px);
      background:
        radial-gradient(900px 520px at 50% 28%, rgba(0,120,255,.14), rgba(0,120,255,0) 55%),
        radial-gradient(900px 600px at 50% 75%, rgba(0,0,0,.06), rgba(0,0,0,0) 55%);
    }

    .status{
      position:absolute;right:14px;bottom:14px;
      display:flex;align-items:center;gap:8px;
      padding:7px 11px;
      border-radius:999px;
      font-size:12px;
      color:var(--sub);
      background:var(--card);
      box-shadow: var(--shadow1), var(--shadow2);
    }
    .dot{
      width:8px;height:8px;border-radius:50%;
      background:rgba(93,107,122,.45);
    }
    .dot.ok{background:var(--accent)}
    .dot.err{background:#ff3b30}

    .foot{
      margin-top:12px;
      padding:12px 14px;
      border-radius:var(--radiusSm);
      background:var(--card);
      box-shadow: var(--shadowIn1), var(--shadowIn2);
      font-size:12px;
      color:var(--sub);
      overflow:auto;
    }
    code{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <div>
        <div class="title">3D 제품 뷰어</div>
        <div class="desc">드래그: 회전 · 휠/핀치: 확대 · 우클릭/두손: 이동</div>
      </div>
      <div class="btns">
        <button id="btnReset" class="primary">시점 초기화</button>
        <button id="btnAuto">자동회전 ON</button>
        <button id="btnAR">AR 안내</button>
      </div>
    </header>

    <div class="card">
      <div class="badge">GRINMAX</div>

      <model-viewer id="mv"
        src="sample_2.gltf"
        camera-controls
        touch-action="pan-y"
        shadow-intensity="1"
        exposure="1"
        environment-image="neutral"
        ar
        ar-modes="webxr scene-viewer quick-look">
      </model-viewer>

      <div class="status" id="statusWrap">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">loading...</span>
      </div>
    </div>

    <div class="foot">
      카페24에는 iframe 한 줄만 넣으면 됩니다.<br/>
      <code>&lt;iframe src="https://leeko0529.github.io/model-viewer/" style="width:100%;height:720px;border:0;border-radius:18px;"&gt;&lt;/iframe&gt;</code>
    </div>
  </div>

  <script>
    const mv = document.getElementById('mv');
    const btnReset = document.getElementById('btnReset');
    const btnAuto = document.getElementById('btnAuto');
    const btnAR = document.getElementById('btnAR');

    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');

    let auto = false;

    mv.addEventListener('load', () => {
      statusText.textContent = 'loaded';
      statusDot.classList.remove('err');
      statusDot.classList.add('ok');
    });

    mv.addEventListener('error', () => {
      statusText.textContent = 'error (파일/경로 확인)';
      statusDot.classList.remove('ok');
      statusDot.classList.add('err');
    });

    btnReset.addEventListener('click', () => {
      mv.cameraOrbit = '0deg 75deg 2.2m';
      mv.cameraTarget = '0m 0m 0m';
      mv.fieldOfView = '45deg';
    });

    btnAuto.addEventListener('click', () => {
      auto = !auto;
      mv.autoRotate = auto;
      btnAuto.textContent = auto ? '자동회전 OFF' : '자동회전 ON';
    });

    btnAR.addEventListener('click', () => {
      alert('모바일에서 AR 버튼(큐브 아이콘)이 보이면 눌러서 AR로 확인할 수 있어요.');
    });

    // 초기값
    mv.cameraOrbit = '0deg 75deg 2.2m';
    mv.cameraTarget = '0m 0m 0m';
    mv.fieldOfView = '45deg';
  </script>
</body>
</html>
